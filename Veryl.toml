[project]
name = "gndless_sample_rate_conversion"
version = "0.4.0"
authors = ["Akiyuki Okayasu"]
description = "Synchronous and asynchronous sample-rate converters for Veryl."
license = "MIT OR Apache-2.0"
repository = "https://github.com/AkiyukiOkayasu/gndless-sample-rate-conversion-veryl"

[build]
sources = ["src"]
clock_type = "posedge"
reset_type = "sync_high"
target = { type = "directory", path = "target" }

[test]

[dependencies]
# 未公開のローカル変更を利用するためpath指定。公開前にgithub依存へ戻す。
gndless_fixedpoint = { path = "../gndless-fixedpoint-veryl" }
gndless_interpolation = { path = "../gndless-interpolation-veryl" }
gndless_nco = { path = "../gndless-nco-veryl" }

[publish]
register = true
bump_commit = true
publish_commit = true
