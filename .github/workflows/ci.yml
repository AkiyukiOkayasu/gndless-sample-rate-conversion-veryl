name: CI

on:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Veryl (stable)
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/veryl.zip" \
            https://github.com/veryl-lang/veryl/releases/latest/download/veryl-x86_64-linux.zip
          unzip -q "$RUNNER_TEMP/veryl.zip" -d "$RUNNER_TEMP/veryl"
          chmod +x "$RUNNER_TEMP/veryl/veryl"
          "$RUNNER_TEMP/veryl/veryl" --version
          echo "$RUNNER_TEMP/veryl" >> "$GITHUB_PATH"
      - name: Format check
        continue-on-error: true
        run: veryl fmt --check
      - run: veryl check
      - run: veryl build
      - run: veryl test
      - run: veryl doc

  backend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Veryl (stable)
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/veryl.zip" \
            https://github.com/veryl-lang/veryl/releases/latest/download/veryl-x86_64-linux.zip
          unzip -q "$RUNNER_TEMP/veryl.zip" -d "$RUNNER_TEMP/veryl"
          chmod +x "$RUNNER_TEMP/veryl/veryl"
          "$RUNNER_TEMP/veryl/veryl" --version
          echo "$RUNNER_TEMP/veryl" >> "$GITHUB_PATH"
      # Veryl 0.22.0 stableのsettle-order relayoutでAOT-CとCraneliftのcomb storageが一致しないため無効化する。
      - name: Backend validation
        env:
          VERYL_COMB_LAYOUT: '0'
        run: veryl test --backend-validate
